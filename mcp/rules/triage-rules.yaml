    - 从远端日志服务器或 SIEM 侧找回已被本机清除的日志

# =====================================================================
# 以下为 v0.2 新增的「结构化规则」。
#
# 与上面 10 条的区别：上面的规则靠 keywords 匹配一段文本（适用于人工粘贴的
# 告警），下面的规则通过 match 段直接比对**采集产物归一化后的字段**
# （适用于 scripts/*-ir-quickcheck.* 的输出）。
#
# match 语法：
#   kind / platform   限定记录种类与平台
#   all               列表内每个谓词都必须成立
#   any               列表内至少一个谓词成立
# 谓词算子：equals / not_equals / in / not_in / contains / not_contains /
#           startswith / not_startswith / endswith / not_endswith /
#           regex / not_regex / exists / not_exists / gt / lt
# 字段缺失时：否定类算子视为成立，肯定类算子一律不成立（避免误命中）。
# =====================================================================

- id: PROC-001
  name: 进程可执行文件位于用户可写目录
  attack:
    technique: T1036
    tactic: Defense Evasion
    name: Masquerading
  severity: high
  keywords:
    any: []
    all: []
  match:
    kind: process
    platform: windows
    all:
      - field: path
        regex: '\\(Temp|AppData|ProgramData|Users\\Public|Windows\\Temp|PerfLogs|Recycle)\\'
      - field: path
        not_startswith:
          - 'C:\Windows\'
          - 'C:\Program Files\'
          - 'C:\Program Files (x86)\'
  false_positive_hints:
    - 便携版软件、绿色软件、自解压更新器
    - 企业内部自研工具未走标准安装路径
    - 安装过程中的临时解包进程
  next_steps:
    - 核对文件数字签名与签名主体（无签名或签名主体陌生的优先级最高）
    - 比对文件哈希与基线快照，确认是否为已知合法程序
    - 查父进程与创建时间，判断是用户主动运行还是被拉起

- id: PROC-002
  name: 进程无有效数字签名且不在系统目录
  attack:
    technique: T1036
    tactic: Defense Evasion
    name: Masquerading
  severity: medium
  keywords:
    any: []
    all: []
  match:
    kind: process
    platform: windows
    all:
      - field: sign
        in:
          - NotSigned
          - HashMismatch
          - UnknownError
      - field: prescreen
        equals: outside-system-dir
  false_positive_hints:
    - 开源工具、内网自研程序普遍未签名
    - 签名服务临时不可用导致的 HashMismatch
  next_steps:
    - HashMismatch 需视为高度可疑（可能被篡改），优先核查
    - 未签名程序结合其网络连接与持久化项一并判断
    - 查该文件在 VirusTotal 等平台的公开情报（**注意：不得上传客户环境样本**）

- id: PROC-003
  name: 进程可执行文件已被删除（Linux）
  attack:
    technique: T1070
    tactic: Defense Evasion
    name: Indicator Removal
  severity: high
  keywords:
    any: []
    all: []
  match:
    kind: process
    platform: linux
    all:
      - field: deleted
        equals: 'yes'
  false_positive_hints:
    - 正常升级过程中的短暂窗口（服务重启后即消失）
    - 容器内进程引用了已卸载的层
  next_steps:
    - 立即固定证据：从 /proc/<pid>/exe 复制出文件副本（进程退出后证据即消失）
    - 记录 pid、启动时间与父进程，判断是否为长期驻留
    - 这是无文件落地类恶意程序的典型特征，按高优先级处理

- id: PROC-004
  name: 隐藏进程（/proc 与 ps 结果不一致）
  attack:
    technique: T1014
    tactic: Defense Evasion
    name: Rootkit
  severity: critical
  keywords:
    any: []
    all: []
  match:
    kind: process
    platform: linux
    all:
      - field: hidden
        equals: 'yes'
  false_positive_hints:
    - ps 使用了非标准的 /proc 挂载视图（极少见）
    - 采集脚本在容器内核命名空间下运行造成的视图差异
  next_steps:
    - 视同 Rootkit 嫌疑，按 P0 升级并考虑隔离主机
    - 用 /proc/<pid>/ 直读方式独立核对（不要依赖 ps、netstat、ls）
    - 检查内核模块、bpf 程序与 ld.so.preload 是否有异常加载项

- id: PROC-005
  name: 脚本解释器从异常位置启动
  attack:
    technique: T1218
    tactic: Defense Evasion
    name: System Binary Proxy Execution
  severity: medium
  keywords:
    any: []
    all: []
  match:
    kind: process
    all:
      - field: name
        in:
          - powershell.exe
          - pwsh.exe
          - cmd.exe
          - wscript.exe
          - cscript.exe
          - mshta.exe
          - rundll32.exe
          - regsvr32.exe
      - field: path
        not_startswith:
          - 'C:\Windows\'
  false_positive_hints:
    - 便携版 PowerShell（PowerShell 7 装在 Program Files 之外的场景）
    - 第三方软件自带的脚本宿主副本
  next_steps:
    - 核对该二进制的签名与文件版本信息
    - 结合命令行内容判断是否被借用执行恶意脚本
    - 参考 windows-host-audit.md 附录 LOLBins 速查表

- id: NET-001
  name: 对外地址上的高危端口监听
  attack:
    technique: T1571
    tactic: Command and Control
    name: Non-Standard Port
  severity: high
  keywords:
    any: []
    all: []
  match:
    kind: connection
    all:
      - field: local_addr
        not_in:
          - '127.0.0.1'
          - '::1'
          - '[::1]'
      - field: local_port
        in:
          - 4444
          - 4445
          - 5555
          - 6666
          - 7777
          - 8888
          - 9999
          - 12345
          - 31337
          - 50050
    any:
      - field: state
        in:
          - LISTEN
          - UNCONN
      - field: state
        not_exists: true
  false_positive_hints:
    - 内部服务恰好使用了这些端口（如 8888 常见于 Jupyter）
    - 开发测试用的临时监听
    - 注意 0.0.0.0 与 :: 表示绑定全部网卡，对外暴露面最大，属重点关注对象
    - Windows 侧 02-listen.csv 无 State 列（采集时已按监听过滤），故本规则对缺失 state 的情况放行
  next_steps:
    - 反查该端口的进程名、路径与签名（这是判定的决定性证据）
    - 用 `netstat -ano` 与 `Get-NetTCPConnection` 交叉验证，防止 netstat 被替换
    - 确认该监听是否在基线快照中存在，不在则重点怀疑

- id: NET-002
  name: 外连到 C2 常用端口
  attack:
    technique: T1571
    tactic: Command and Control
    name: Non-Standard Port
  severity: high
  keywords:
    any: []
    all: []
  match:
    kind: connection
    all:
      - field: remote_port
        in:
          - 4444
          - 4445
          - 5555
          - 6666
          - 7777
          - 9999
          - 12345
          - 31337
          - 50050
          - 14444
          - 45560
  false_positive_hints:
    - 企业自研系统的内部端口恰好撞上这些值
    - 云服务商的自定义端口
    - 注意：Windows 侧 02-established.csv 本身只含已建立连接，故本规则不再校验 state
  next_steps:
    - 查 remote_addr 的 ASN 归属与备案信息（不要只凭 IP 首段猜国家）
    - 反查发起连接的进程，核对签名与路径
    - 结合 DNS 缓存记录判断域名来源

- id: NET-003
  name: 矿池端口通信迹象
  attack:
